// =============================================
//  APEX LEGENDS - MOVEMENT CONFIG
//  Tap Strafe / Neo Strafe / Superglide
//  Uses GAME'S OWN config system - no external software
// =============================================

// ── SCROLL WHEEL JUMP (wajib untuk tap strafe) ──────────────────────
// Scroll down = jump, untuk tap strafe
bind "MWHEELDOWN" "+jump"

// Optional: scroll up juga bisa jump (pilih salah satu atau keduanya)
// bind "MWHEELUP" "+jump"

// ── SUPERGLIDE BIND ──────────────────────────────────────────────────
// Superglide butuh jump+crouch dalam 1 frame (timing ~0.15 detik sebelum mantle selesai)
// Bind ini eksekusi keduanya bersamaan via scroll
bind "MWHEELUP" "+jump; +duck"

// ── TAP STRAFE SETTINGS ──────────────────────────────────────────────
// FPS tinggi = tap strafe lebih konsisten
// Pastikan fps_max di video settings setinggi mungkin

// ── MOVEMENT KEYS (default, sesuaikan kalau beda) ────────────────────
bind "w" "+forward"
bind "a" "+moveleft"
bind "s" "+back"
bind "d" "+moveright"
bind "SPACE" "+jump"
bind "LCTRL" "+duck"
bind "LSHIFT" "+sprint"

// ── ALIAS UNTUK NEO STRAFE ───────────────────────────────────────────
// Neo strafe = tap D, tap A, tap D cepat saat di udara sambil scroll
// Tidak bisa di-automate via cfg tanpa AHK — harus manual + scroll wheel
// Tapi bind ini bantu timing-nya lebih responsif:
alias "+fastleft"  "+moveleft"
alias "-fastleft"  "-moveleft"
alias "+fastright" "+moveright"
alias "-fastright" "-moveright"

// ── TIPS PENGGUNAAN ──────────────────────────────────────────────────
// TAP STRAFE:
//   1. Lari + slide jump
//   2. Di puncak lompat, scroll down cepat (3x = triple tap strafe)
//   3. Gerakkan mouse ke arah yang mau dituju
//
// SUPERGLIDE:
//   1. Lari ke edge/ledge, mulai mantle (panjat)
//   2. ~0.15 detik sebelum mantle selesai: scroll UP (jump+duck bersamaan)
//   3. Karakter akan superglide ke depan
//
// SUPERGLIDE REDIRECT:
//   1. Superglide seperti biasa
//   2. Langsung scroll DOWN (tap strafe) + gerak mouse ke arah baru
//
// CIRCULAR SUPERGLIDE:
//   1. Superglide ke arah tertentu
//   2. Sambil superglide, putar mouse slow circular
//   3. Hasilnya karakter berputar di udara
